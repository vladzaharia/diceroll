name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings (or the release file name), e.g. 0.2.0
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux / Steam Deck, Android, iPhone / iPad, Web, Built from source]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: Godot log lines around the problem (SCRIPT ERROR / ERROR), if any.
      render: text
