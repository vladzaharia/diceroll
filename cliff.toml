# git-cliff configuration (https://git-cliff.org): the developer changelog.
#   git-cliff -o CHANGELOG.md                 full CHANGELOG.md
#   git-cliff --latest --strip header         the section for the newest tag (release job)
#   git-cliff --unreleased --tag vX.Y.Z       preview the next release
# Commits follow Conventional Commits (docs/CONVENTIONAL_COMMITS.md); older free-form commits
# land in "Other".

[changelog]
header = """
# Changelog

All notable changes to Diceroll. Generated by [git-cliff](https://git-cliff.org) from
[Conventional Commits](docs/CONVENTIONAL_COMMITS.md); player-facing notes are on each GitHub Release.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}\
{% if commit.breaking %} **[BREAKING]**{% endif %} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}\
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^balance", group = "<!-- 3 -->Balance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^(ci|build)", group = "<!-- 6 -->Build and CI" },
  { message = "^(test|chore|style)", group = "<!-- 7 -->Maintenance" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
