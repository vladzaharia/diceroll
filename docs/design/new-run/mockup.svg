<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1040" viewBox="0 0 1960 1040" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg{fill:#14112a}
      .frame{fill:#1b2140;stroke:#6b4423;stroke-width:16}
      .card{fill:#232a52;stroke:#ffffff22;stroke-width:2}
      .sel{fill:#2b3466;stroke:#ffc63a;stroke-width:4}
      .lock{fill:#15182e;stroke:#ffffff10;stroke-width:2}
      .h{fill:#ffc63a;font-weight:800;font-size:20px;letter-spacing:1px}
      .t{fill:#f4efe6;font-weight:700}
      .d{fill:#b7b3c9}
      .m{fill:#7f7b95}
      .note{fill:#9fe1ff;font-size:17px;font-style:italic}
      .rule{stroke:#ffc63a55;stroke-width:2}
      .med{fill:#3a4580;stroke:#ffffff55;stroke-width:3}
      .medg{fill:#3b3f52;stroke:#ffffff22;stroke-width:3}
      .gold{fill:#ffc63a}
      .ink{fill:#2a1a0a;font-weight:900}
    </style>
  </defs>
  <rect class="bg" width="1960" height="1040"/>
  <text x="30" y="40" fill="#fff" font-size="26" font-weight="800">NEW RUN: desktop / iPad landscape (two columns)</text>
  <text x="1460" y="40" fill="#fff" font-size="26" font-weight="800">phone (one column)</text>

  <!-- ===================== DESKTOP ===================== -->
  <g transform="translate(30,80)">
    <rect class="frame" x="0" y="20" width="1360" height="930" rx="26"/>
    <!-- plaque + close -->
    <rect x="560" y="-8" width="240" height="64" rx="14" fill="#ffc63a" stroke="#c98a12" stroke-width="4"/>
    <text x="680" y="35" text-anchor="middle" class="ink" font-size="34">NEW RUN</text>
    <circle cx="1350" cy="30" r="30" fill="#e5484d" stroke="#8c1d22" stroke-width="4"/>
    <text x="1350" y="41" text-anchor="middle" fill="#2a0a0a" font-size="30" font-weight="900">×</text>

    <!-- LEFT: HERO -->
    <g transform="translate(40,70)">
      <circle cx="12" cy="10" r="11" class="gold"/><text x="32" y="17" class="h">HERO</text>
      <line x1="100" y1="10" x2="620" y2="10" class="rule"/>
      <rect class="sel" x="0" y="30" width="620" height="290" rx="20"/>
      <rect x="20" y="50" width="190" height="250" rx="16" fill="#0f1330" stroke="#6fa8ff" stroke-width="3"/>
      <text x="115" y="180" text-anchor="middle" class="m" font-size="18">turning portrait</text>
      <text x="232" y="92" class="t" font-size="38" fill="#9cc3ff">Knight</text>
      <rect x="232" y="108" width="84" height="34" rx="17" fill="#3b1f2a"/><text x="246" y="132" fill="#ff7b7b" font-size="20" font-weight="800">♥ 40</text>
      <rect x="324" y="108" width="84" height="34" rx="17" fill="#2a2f45"/><text x="338" y="132" class="t" font-size="20">⚔ +1</text>
      <rect x="416" y="108" width="96" height="34" rx="17" fill="#2a2f45"/><text x="430" y="132" fill="#ffd36a" font-size="20" font-weight="800">⟳ 2</text>
      <rect class="card" x="232" y="154" width="370" height="64" rx="14"/>
      <circle cx="262" cy="186" r="20" class="med"/>
      <text x="292" y="180" fill="#9fe1ff" font-size="19" font-weight="800">OATH</text>
      <text x="292" y="204" class="d" font-size="16">Keep the oath: +Block when you hold.</text>
      <text x="232" y="244" fill="#7ad08a" font-size="17" font-weight="800">KIT</text>
      <g fill="#2a3160" stroke="#ffffff30" stroke-width="2">
        <rect x="232" y="252" width="54" height="54" rx="10"/><rect x="292" y="252" width="54" height="54" rx="10"/>
        <rect x="352" y="252" width="54" height="54" rx="10"/><rect x="412" y="252" width="54" height="54" rx="10"/>
      </g>
      <circle cx="570" cy="279" r="27" fill="#4a7bd1" stroke="#1f3f7a" stroke-width="3"/><text x="570" y="286" text-anchor="middle" fill="#0b1630" font-size="20" font-weight="900">⚒</text>
      <text x="0" y="350" class="note">hero = portrait + name + stat chips + mechanic + kit; the anvil opens the Armory</text>

      <!-- class grid 4 x 3 -->
      <g transform="translate(0,372)">
        <g id="tiles">
          <rect class="sel" x="0" y="0" width="146" height="112" rx="16"/><circle cx="73" cy="42" r="28" class="med"/><text x="73" y="96" text-anchor="middle" fill="#ffd36a" font-size="18" font-weight="800">Knight</text>
          <rect class="card" x="158" y="0" width="146" height="112" rx="16"/><circle cx="231" cy="42" r="28" class="med"/><text x="231" y="96" text-anchor="middle" class="t" font-size="18">Ranger</text>
          <rect class="card" x="316" y="0" width="146" height="112" rx="16"/><circle cx="389" cy="42" r="28" class="med"/><text x="389" y="96" text-anchor="middle" class="t" font-size="18">Mage</text>
          <rect class="card" x="474" y="0" width="146" height="112" rx="16"/><circle cx="547" cy="42" r="28" class="med"/><text x="547" y="96" text-anchor="middle" class="t" font-size="18">Rogue</text>
          <rect class="card" x="0" y="124" width="146" height="112" rx="16"/><circle cx="73" cy="166" r="28" class="med"/><text x="73" y="220" text-anchor="middle" class="t" font-size="18">Barbarian</text>
          <rect class="card" x="158" y="124" width="146" height="112" rx="16"/><circle cx="231" cy="166" r="28" class="med"/><text x="231" y="220" text-anchor="middle" class="t" font-size="18">Druid</text>
          <rect class="lock" x="316" y="124" width="146" height="112" rx="16"/><circle cx="389" cy="166" r="28" class="medg"/><text x="389" y="220" text-anchor="middle" class="m" font-size="18">Paladin</text><text x="438" y="148" class="m" font-size="18">🔒</text>
          <rect class="lock" x="474" y="124" width="146" height="112" rx="16"/><circle cx="547" cy="166" r="28" class="medg"/><text x="547" y="220" text-anchor="middle" class="m" font-size="18">Ninja</text><text x="596" y="148" class="m" font-size="18">🔒</text>
          <rect class="lock" x="0" y="248" width="146" height="112" rx="16"/><circle cx="73" cy="290" r="28" class="medg"/><text x="73" y="344" text-anchor="middle" class="m" font-size="18">Engineer</text>
          <rect class="lock" x="158" y="248" width="146" height="112" rx="16"/><circle cx="231" cy="290" r="28" class="medg"/><text x="231" y="344" text-anchor="middle" class="m" font-size="18">Necro…</text>
          <rect class="lock" x="316" y="248" width="146" height="112" rx="16"/><circle cx="389" cy="290" r="28" class="medg"/><text x="389" y="344" text-anchor="middle" class="m" font-size="18">Mage II</text>
          <rect class="card" x="474" y="248" width="146" height="112" rx="16" stroke="#a37be0"/><circle cx="547" cy="290" r="28" fill="#3a2f55" stroke="#a37be0" stroke-width="3"/><text x="547" y="300" text-anchor="middle" fill="#c9b6ef" font-size="26" font-weight="900">?</text><text x="547" y="344" text-anchor="middle" fill="#c9b6ef" font-size="18">???</text>
        </g>
        <rect class="card" x="0" y="372" width="620" height="44" rx="12"/>
        <text x="18" y="401" class="d" font-size="17">🔒  Paladin: win a run with the Knight. Or 6 Sigils.</text>
        <text x="0" y="440" class="note">one line = the unlock hint of the hovered / tapped locked hero (first locked by default)</text>
      </g>
    </g>

    <!-- RIGHT: ROUTE / LOADOUT -->
    <g transform="translate(700,70)">
      <circle cx="12" cy="10" r="11" class="gold"/><text x="32" y="17" class="h">ROUTE</text>
      <line x1="110" y1="10" x2="620" y2="10" class="rule"/>
      <rect class="sel" x="0" y="30" width="304" height="124" rx="18"/>
      <circle cx="44" cy="76" r="26" class="med"/><text x="82" y="70" fill="#ffd36a" font-size="26" font-weight="800">Standard</text><text x="276" y="70" fill="#ffd36a" font-size="22">✔</text>
      <text x="82" y="96" class="d" font-size="16">full run</text>
      <text x="20" y="138" class="t" font-size="19">⚑ 15    ◈ 3    ♛ 100%</text>
      <rect class="card" x="316" y="30" width="304" height="124" rx="18"/>
      <circle cx="360" cy="76" r="26" class="med"/><text x="398" y="70" class="t" font-size="26">Short Road</text>
      <text x="398" y="96" class="d" font-size="16">quick run</text>
      <text x="336" y="138" class="t" font-size="19">⚑ 10    ◈ 2    ♛ 60%</text>

      <rect class="card" x="0" y="168" width="620" height="78" rx="14"/>
      <text x="16" y="194" class="m" font-size="15" font-weight="800">BIOMES</text>
      <g>
        <text x="16" y="230" fill="#ffd36a" font-size="17" font-weight="800">I</text>
        <circle cx="50" cy="222" r="17" fill="#5fae5c"/><circle cx="90" cy="222" r="17" fill="#7a6aa0"/><circle cx="130" cy="222" r="17" fill="#3b3f52"/>
        <text x="160" y="229" class="m" font-size="22">›</text>
        <text x="182" y="230" fill="#ffd36a" font-size="17" font-weight="800">II</text>
        <circle cx="222" cy="222" r="17" fill="#8c5ca8"/><circle cx="262" cy="222" r="17" fill="#7fc6e8"/><circle cx="302" cy="222" r="17" fill="#3b3f52"/>
        <text x="332" y="229" class="m" font-size="22">›</text>
        <text x="354" y="230" fill="#ffd36a" font-size="17" font-weight="800">III</text>
        <circle cx="400" cy="222" r="17" fill="#d0a43a"/><circle cx="440" cy="222" r="17" fill="#e0603a"/><circle cx="480" cy="222" r="17" fill="#3b3f52"/><circle cx="520" cy="222" r="17" fill="#3b3f52"/>
      </g>

      <rect class="card" x="0" y="260" width="620" height="170" rx="18" stroke="#e5484d88" stroke-width="3"/>
      <circle cx="54" cy="310" r="32" fill="#2c3354" stroke="#ffffff33" stroke-width="3"/><text x="54" y="320" text-anchor="middle" class="t" font-size="30">−</text>
      <circle cx="566" cy="310" r="32" fill="#2c3354" stroke="#ffffff33" stroke-width="3"/><text x="566" y="320" text-anchor="middle" class="t" font-size="30">+</text>
      <text x="310" y="306" text-anchor="middle" fill="#ff8a7a" font-size="30" font-weight="900">ASCENSION 3</text>
      <text x="310" y="334" text-anchor="middle" class="m" font-size="16">● ● ● ○ ○ ○ · · · ·   up to 6</text>
      <text x="22" y="368" class="d" font-size="16">1  Lap mutations spawn +1 Elite; elites have +15% HP.</text>
      <text x="22" y="392" class="d" font-size="16">2  Lap heal 10% → 8%.</text>
      <text x="22" y="416" fill="#ffd36a" font-size="16" font-weight="700">3  Shops cost +10%; restocks cost 12.   NEW</text>
      <text x="0" y="452" class="note">the stacked rules = the run's modifiers, listed under the level</text>

      <g transform="translate(0,476)">
        <circle cx="12" cy="10" r="11" class="gold"/><text x="32" y="17" class="h">LOADOUT</text>
        <line x1="140" y1="10" x2="620" y2="10" class="rule"/>
        <rect class="card" x="0" y="30" width="304" height="112" rx="16"/>
        <text x="16" y="56" class="m" font-size="15" font-weight="800">PET</text><text x="284" y="56" class="m" font-size="20">›</text>
        <circle cx="44" cy="100" r="26" fill="#d0803a"/><text x="82" y="98" class="t" font-size="22">Pumpkin Sprite</text><text x="82" y="122" fill="#7ad08a" font-size="16" font-weight="800">LV 5</text>
        <rect class="card" x="316" y="30" width="304" height="112" rx="16"/>
        <text x="332" y="56" class="m" font-size="15" font-weight="800">MINIGAMES  2 / 3</text><text x="600" y="56" class="m" font-size="20">›</text>
        <circle cx="360" cy="100" r="24" fill="#d0a43a"/><circle cx="420" cy="100" r="24" fill="#6fc8ff"/><circle cx="480" cy="100" r="24" class="medg"/><text x="474" y="106" class="m" font-size="16">🔒</text>
        <rect class="card" x="0" y="154" width="304" height="112" rx="16"/>
        <text x="16" y="180" class="m" font-size="15" font-weight="800">POTION BELT  2</text><text x="284" y="180" class="m" font-size="20">›</text>
        <circle cx="44" cy="224" r="22" fill="#e5484d"/><circle cx="98" cy="224" r="22" fill="#e5484d"/><circle cx="152" cy="224" r="22" class="medg"/>
        <rect class="card" x="316" y="154" width="304" height="112" rx="16"/>
        <text x="332" y="180" class="m" font-size="15" font-weight="800">DICE POOL  3 / 8 PACKS</text><text x="600" y="180" class="m" font-size="20">›</text>
        <rect x="336" y="202" width="42" height="42" rx="8" fill="#7ad0ff"/><rect x="386" y="202" width="42" height="42" rx="8" fill="#e0925a"/><rect x="436" y="202" width="42" height="42" rx="8" fill="#9fe17a"/>
        <text x="0" y="290" class="note">whole tile = shortcut to its station (Pet Den, Arcade, Armory, Workshop)</text>
      </g>
    </g>

    <!-- sticky footer -->
    <line x1="40" y1="840" x2="1320" y2="840" stroke="#ffffff18" stroke-width="2"/>
    <rect x="40" y="852" width="1280" height="80" rx="16" fill="#ffc63a" stroke="#c98a12" stroke-width="4"/>
    <text x="680" y="893" text-anchor="middle" class="ink" font-size="36">▶  START RUN</text>
    <text x="680" y="920" text-anchor="middle" fill="#5a3a10" font-size="18" font-weight="700">Knight · Standard · Ascension 3</text>
    <rect x="1254" y="862" width="56" height="30" rx="6" fill="#00000033"/><text x="1282" y="883" text-anchor="middle" fill="#2a1a0a" font-size="15" font-weight="800">ENTER</text>
  </g>
  <text x="70" y="1030" class="note">START RUN lives in a footer outside the scroll (always visible); ENTER keycap only on hover. × / Esc is the one exit.</text>

  <!-- ===================== PHONE ===================== -->
  <g transform="translate(1460,80)">
    <rect x="0" y="0" width="460" height="940" rx="40" fill="#0b0a18" stroke="#444" stroke-width="3"/>
    <rect class="frame" x="16" y="70" width="428" height="850" rx="18" stroke-width="10"/>
    <rect x="160" y="50" width="140" height="42" rx="10" fill="#ffc63a"/><text x="230" y="78" text-anchor="middle" class="ink" font-size="22">NEW RUN</text>
    <circle cx="436" cy="76" r="20" fill="#e5484d"/>
    <g transform="translate(34,110)">
      <text x="0" y="12" class="h" font-size="15">HERO</text>
      <rect class="sel" x="0" y="22" width="392" height="168" rx="14"/>
      <rect x="12" y="34" width="110" height="144" rx="10" fill="#0f1330" stroke="#6fa8ff" stroke-width="2"/>
      <text x="136" y="62" class="t" font-size="24" fill="#9cc3ff">Knight</text>
      <text x="136" y="88" fill="#ff7b7b" font-size="14" font-weight="800">♥ 40   ⚔ +1   ⟳ 2</text>
      <rect class="card" x="136" y="98" width="244" height="36" rx="8"/><text x="146" y="121" fill="#9fe1ff" font-size="13" font-weight="800">OATH  Keep the oath…</text>
      <g fill="#2a3160"><rect x="136" y="142" width="32" height="32" rx="6"/><rect x="174" y="142" width="32" height="32" rx="6"/><rect x="212" y="142" width="32" height="32" rx="6"/></g>
      <circle cx="362" cy="158" r="16" fill="#4a7bd1"/>
      <g transform="translate(0,200)">
        <rect class="sel" x="0" y="0" width="92" height="70" rx="10"/><rect class="card" x="100" y="0" width="92" height="70" rx="10"/><rect class="card" x="200" y="0" width="92" height="70" rx="10"/><rect class="card" x="300" y="0" width="92" height="70" rx="10"/>
        <rect class="card" x="0" y="78" width="92" height="70" rx="10"/><rect class="card" x="100" y="78" width="92" height="70" rx="10"/><rect class="lock" x="200" y="78" width="92" height="70" rx="10"/><rect class="lock" x="300" y="78" width="92" height="70" rx="10"/>
        <rect class="lock" x="0" y="156" width="92" height="70" rx="10"/><rect class="lock" x="100" y="156" width="92" height="70" rx="10"/><rect class="lock" x="200" y="156" width="92" height="70" rx="10"/><rect class="card" x="300" y="156" width="92" height="70" rx="10"/>
        <text x="0" y="250" class="d" font-size="12">🔒 Paladin: win a run with the Knight.</text>
      </g>
      <text x="0" y="482" class="h" font-size="15">ROUTE</text>
      <rect class="sel" x="0" y="492" width="192" height="80" rx="12"/><rect class="card" x="200" y="492" width="192" height="80" rx="12"/>
      <rect class="card" x="0" y="580" width="392" height="44" rx="10"/>
      <rect class="card" x="0" y="632" width="392" height="70" rx="12"/>
      <text x="0" y="728" class="h" font-size="15">LOADOUT</text>
      <rect class="card" x="0" y="738" width="192" height="60" rx="10"/><rect class="card" x="200" y="738" width="192" height="60" rx="10"/>
    </g>
    <rect x="34" y="838" width="392" height="62" rx="12" fill="#ffc63a"/><text x="230" y="878" text-anchor="middle" class="ink" font-size="24">▶ START RUN</text>
    <text x="10" y="934" class="m" font-size="13">body scrolls; START stays pinned</text>
  </g>
</svg>
